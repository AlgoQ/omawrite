[package]
name = "omawrite"
version = "0.1.0"
description = "Omawrite Next: a slipbox-first Markdown editor"
edition = "2021"
license = "MIT"

[lib]
name = "omawrite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
base64 = "0.22"
omawrite-core = { path = "../crates/omawrite-core" }
