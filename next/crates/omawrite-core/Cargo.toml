[package]
name = "omawrite-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vault, note index, frontmatter and note operations for Omawrite Next"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
notify = "8"

[dev-dependencies]
tempfile = "3"
